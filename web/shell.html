<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Peepo Drum Kit (Web)</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1f1f1f; color: #ddd; font: 14px/1.5 system-ui, sans-serif; overflow: hidden; }
    /* The editor fills whatever size #pdk-root has; to embed it in another page just size that element */
    #pdk-root { position: absolute; inset: 0; }
    #canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
    #pdk-loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: #1f1f1f; text-align: center; padding: 24px; }
    #pdk-loading.hidden { display: none; }
    #pdk-loading h1 { font-size: 20px; font-weight: 600; margin: 0; }
    #pdk-loading progress { width: min(360px, 80vw); }
    #pdk-loading .credits { max-width: 560px; font-size: 12px; color: #999; }
    #pdk-loading a { color: #8ab4f8; }
    #pdk-status.error { color: #ff8a80; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div id="pdk-root">
    <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
    <div id="pdk-loading">
      <h1>Peepo Drum Kit</h1>
      <progress id="pdk-progress" max="100"></progress>
      <div id="pdk-status">Loading…</div>
      <div class="credits">
        Unofficial WebAssembly build. Peepo Drum Kit is © 2022 <a href="https://github.com/samyuu/PeepoDrumKit" target="_blank" rel="noopener">samyuu</a>,
        with later work by <a href="https://github.com/0auBSQ/PeepoDrumKit" target="_blank" rel="noopener">0auBSQ</a>,
        <a href="https://github.com/Steve-xmh/PeepoDrumKit" target="_blank" rel="noopener">Steve-xmh</a> (SDL3 port) and
        <a href="https://github.com/IepIweidieng/PeepoDrumKit-sdl3" target="_blank" rel="noopener">IepIweidieng</a>.
        Third party licenses: <a href="license_txt/" target="_blank" rel="noopener">license_txt/</a>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var canvas = document.getElementById("canvas");
      var loading = document.getElementById("pdk-loading");
      var statusElement = document.getElementById("pdk-status");
      var progressElement = document.getElementById("pdk-progress");
      var query = new URLSearchParams(location.search);
      var started = false;

      function showError(message) {
        loading.classList.remove("hidden");
        progressElement.style.display = "none";
        statusElement.classList.add("error");
        statusElement.textContent = message;
      }

      // Keyboard input only goes to the editor while the canvas is focused, so that a host page keeps its own shortcuts
      canvas.addEventListener("mousedown", function () { canvas.focus(); });
      canvas.addEventListener("webglcontextlost", function (event) { event.preventDefault(); showError("The WebGL context was lost. Please reload the page."); });
      window.addEventListener("error", function (event) { if (!started) showError("Failed to start: " + event.message); });

      window.Module = {
        canvas: canvas,
        // Options read by pdk_api.js: persistSettings, warnOnUnload, handleFileDrop, setDocumentTitle (all default true)
        pdkOptions: {},
        print: function (text) { console.log(text); },
        printErr: function (text) { console.warn(text); },
        setStatus: function (text) {
          var match = /([^(]+)\((\d+(?:\.\d+)?)\/(\d+)\)/.exec(text || "");
          if (match) { progressElement.value = parseFloat(match[2]); progressElement.max = parseFloat(match[3]); statusElement.textContent = match[1].trim(); }
          else if (text) { statusElement.textContent = text; }
        },
        onAbort: function (reason) { showError("The editor crashed: " + reason + "\nPlease reload the page."); },
      };

      // NOTE: Checked on a throwaway canvas so that SDL gets to create the real context with its own attributes
      if (!document.createElement("canvas").getContext("webgl2")) {
        showError("This browser does not support WebGL 2, which the editor requires.");
        return;
      }

      var script = document.createElement("script");
      script.src = "peepodrumkit.js";
      script.onerror = function () { showError("Failed to load peepodrumkit.js"); };
      script.onload = function () {
        Module.pdk.ready.then(function (pdk) {
          started = true;
          loading.classList.add("hidden");
          canvas.focus();
          setupPostMessageBridge(pdk);
        });
      };
      document.body.appendChild(script);

      // ---------------------------------------------------------------------------------------------------------------
      // Optional iframe integration: the embedding page talks to the editor via window.postMessage (see web/README.md).
      // Only active when this page runs inside a frame. Messages are accepted from / sent to the same origin by default,
      // or the origin given via ?parentOrigin=https://example.com
      // ---------------------------------------------------------------------------------------------------------------
      function setupPostMessageBridge(pdk) {
        if (window.parent === window) return;
        var parentOrigin = query.get("parentOrigin") || location.origin;
        function post(message, transfer) { window.parent.postMessage(message, parentOrigin, transfer || []); }

        pdk.onSave = function (tja, fileName) { post({ type: "pdk:save", tja: tja, fileName: fileName }); };
        window.addEventListener("message", function (event) {
          if (event.source !== window.parent || event.origin !== parentOrigin) return;
          var message = event.data || {};
          try {
            switch (message.type) {
              case "pdk:openChart": pdk.openChart(message.chart); post({ type: "pdk:opened", requestId: message.requestId }); break;
              case "pdk:loadAudio": pdk.loadAudio(message.audio, message.audioName); break;
              case "pdk:getTJA": post({ type: "pdk:tja", requestId: message.requestId, tja: pdk.getTJA(), hasUnsavedChanges: pdk.hasUnsavedChanges() }); break;
              case "pdk:markSaved": pdk.markSaved(); break;
              case "pdk:newChart": pdk.newChart(); break;
            }
          } catch (error) {
            post({ type: "pdk:error", requestId: message.requestId, message: String(error && error.message || error) });
          }
        });
        post({ type: "pdk:ready" });
      }
    })();
  </script>
</body>
</html>
