General: Default Creator Name = Общие: Имя автора по умолчанию
The name that is automatically filled in when creating a new chart. = Имя, которое автоматически подставляется при создании нового чарта.
General: Drumroll Preview Interval = Общие: Интервал предпросмотра дроби
The interval at which drumrolls have their hit sounds previewed at. = Интервал, с которым воспроизводятся удары дробей при предпросмотре.
General: Time Display Space = Общие: Отображение времени
Display time in either Chart Space (normalized starting at 00:00.000) or in Song Space (relative to song offset). = Показывать время во времени чарта (отсчёт с 00:00.000) или во времени песни (относительно смещения песни).
Timeline: Invert Scroll Wheel Direction = Таймлайн: Инвертировать колесо мыши
Invert the mouse wheel scroll direcion so that scrolling downwards results in moving forward through the timeline. = Инвертировать направление колеса мыши, чтобы прокрутка вниз перемещала вперёд по таймлайну.
Timeline: Scroll Wheel Sensitivity = Таймлайн: Чувствительность колеса мыши
The timeline distance moved per mouse wheel scroll tick. = Расстояние, на которое сдвигается таймлайн за один шаг колеса мыши.
Timeline: Scroll Wheel Sensitivity (Shift) = Таймлайн: Чувствительность колеса мыши (Shift)
The timeline distance moved per mouse wheel scroll tick while holding down shift. = Расстояние, на которое сдвигается таймлайн за один шаг колеса мыши при зажатом Shift.
Animation: Smooth UI Zoom = Анимация: Плавное масштабирование интерфейса
Smoothly animate between UI zoom levels. = Плавная анимация при смене масштаба интерфейса.
Animation: Timeline Smooth Scroll Speed = Анимация: Скорость плавной прокрутки таймлайна
The animation speed when scrolling the timeline. = Скорость анимации при прокрутке таймлайна.
Animation: Timeline Smooth Cursor Speed = Анимация: Скорость плавного курсора таймлайна
The animation speed for the timeline cursor when moving to a new position. = Скорость анимации курсора таймлайна при переходе на новую позицию.
Animation: Timeline Range Selection Speed = Анимация: Скорость выделения диапазона на таймлайне
The animation speed for the timeline range selection expansion. = Скорость анимации расширения выделения диапазона на таймлайне.
Open Device on Startup = Открывать устройство при запуске
Create an audio session as soon as the program starts. = Создавать аудиосессию сразу при запуске программы.
Close Device on Idle Focus Loss = Закрывать устройство при потере фокуса в простое
Automatically close the audio session when loosing window focus and while not playing any sounds. = Автоматически закрывать аудиосессию, когда окно теряет фокус и звук не воспроизводится.
Low-Latency Exclusive Mode = Монопольный режим с низкой задержкой
Reduce audio latency by requesting exlusive device access.\nThis will prevent all *other* applications from playing back or recording audio. = Уменьшить задержку звука, запросив монопольный доступ к устройству.\nВсе *остальные* приложения не смогут воспроизводить и записывать звук.
Buffer Frame Size = Размер буфера (кадры)
Prevent audio distortion by requesting sufficient buffer size (adding audio latency).\nThe minimum resulting size is the minimum possible size reported by the device. = Избежать искажений звука, запросив достаточный размер буфера (увеличивает задержку).\nМинимальный итоговый размер — наименьший, о котором сообщает устройство.
