General: Default Creator Name = 一般: 預設作者名稱
The name that is automatically filled in when creating a new chart. = 建立新譜面時自動填入的作者名稱。
General: Drumroll Preview Interval = 一般: 連打預覽間隔
The interval at which drumrolls have their hit sounds previewed at. = 預覽連打打擊音的間隔。
General: Time Display Space = 一般: 時間顯示基準
Display time in either Chart Space (normalized starting at 00:00.000) or in Song Space (relative to song offset). = 時間要以譜面時間（從 00:00.000 起算）或歌曲時間（相對於歌曲 OFFSET）顯示。
Timeline: Invert Scroll Wheel Direction = 時間軸: 反轉滾輪方向
Invert the mouse wheel scroll direcion so that scrolling downwards results in moving forward through the timeline. = 反轉滑鼠滾輪方向，讓往下捲動變成在時間軸上往前移動。
Timeline: Scroll Wheel Sensitivity = 時間軸: 滾輪靈敏度
The timeline distance moved per mouse wheel scroll tick. = 滑鼠滾輪每捲一格在時間軸上移動的距離。
Timeline: Scroll Wheel Sensitivity (Shift) = 時間軸: 滾輪靈敏度（按住 Shift）
The timeline distance moved per mouse wheel scroll tick while holding down shift. = 按住 Shift 時，滑鼠滾輪每捲一格在時間軸上移動的距離。
Animation: Smooth UI Zoom = 動畫: 平滑介面縮放
Smoothly animate between UI zoom levels. = 切換介面縮放比例時使用平滑動畫。
Animation: Timeline Smooth Scroll Speed = 動畫: 時間軸平滑捲動速度
The animation speed when scrolling the timeline. = 捲動時間軸時的動畫速度。
Animation: Timeline Smooth Cursor Speed = 動畫: 時間軸游標平滑移動速度
The animation speed for the timeline cursor when moving to a new position. = 時間軸游標移動到新位置時的動畫速度。
Animation: Timeline Range Selection Speed = 動畫: 時間軸範圍選取動畫速度
The animation speed for the timeline range selection expansion. = 時間軸範圍選取展開時的動畫速度。
Open Device on Startup = 啟動時開啟音訊裝置
Create an audio session as soon as the program starts. = 程式一啟動就建立音訊工作階段。
Close Device on Idle Focus Loss = 閒置且失去焦點時關閉音訊裝置
Automatically close the audio session when loosing window focus and while not playing any sounds. = 視窗失去焦點且沒有播放任何聲音時，自動關閉音訊工作階段。
Low-Latency Exclusive Mode = 低延遲獨佔模式
Reduce audio latency by requesting exlusive device access.\nThis will prevent all *other* applications from playing back or recording audio. = 要求獨佔音訊裝置以降低延遲。\n啟用後，*其他*應用程式都無法播放或錄製聲音。
Buffer Frame Size = 緩衝區大小（frame）
Prevent audio distortion by requesting sufficient buffer size (adding audio latency).\nThe minimum resulting size is the minimum possible size reported by the device. = 要求足夠大的緩衝區以避免聲音破音（會增加延遲）。\n實際最小值是裝置回報的最小可用大小。
