General: Default Creator Name = 一般: 既定の作者名
The name that is automatically filled in when creating a new chart. = 新しい譜面を作成するときに自動入力される名前です。
General: Drumroll Preview Interval = 一般: 連打プレビューの間隔
The interval at which drumrolls have their hit sounds previewed at. = 連打の打音をプレビューする間隔です。
General: Time Display Space = 一般: 時間表示の基準
Display time in either Chart Space (normalized starting at 00:00.000) or in Song Space (relative to song offset). = 時間を譜面基準（00:00.000 から開始）または曲基準（曲の OFFSET からの相対）で表示します。
Timeline: Invert Scroll Wheel Direction = タイムライン: ホイールの方向を反転
Invert the mouse wheel scroll direcion so that scrolling downwards results in moving forward through the timeline. = マウスホイールの方向を反転し、下スクロールでタイムラインを先へ進めます。
Timeline: Scroll Wheel Sensitivity = タイムライン: ホイールの感度
The timeline distance moved per mouse wheel scroll tick. = マウスホイール 1 目盛りあたりのタイムライン移動量です。
Timeline: Scroll Wheel Sensitivity (Shift) = タイムライン: ホイールの感度（Shift）
The timeline distance moved per mouse wheel scroll tick while holding down shift. = Shift を押している間の、マウスホイール 1 目盛りあたりのタイムライン移動量です。
Animation: Smooth UI Zoom = アニメーション: UI ズームを滑らかに
Smoothly animate between UI zoom levels. = UI のズーム倍率の切り替えを滑らかにアニメーションします。
Animation: Timeline Smooth Scroll Speed = アニメーション: タイムラインのスムーズスクロール速度
The animation speed when scrolling the timeline. = タイムラインをスクロールするときのアニメーション速度です。
Animation: Timeline Smooth Cursor Speed = アニメーション: タイムラインのカーソル移動速度
The animation speed for the timeline cursor when moving to a new position. = タイムラインのカーソルが新しい位置へ移動するときのアニメーション速度です。
Animation: Timeline Range Selection Speed = アニメーション: タイムラインの範囲選択の速度
The animation speed for the timeline range selection expansion. = タイムラインの範囲選択が広がるときのアニメーション速度です。
Open Device on Startup = 起動時にデバイスを開く
Create an audio session as soon as the program starts. = プログラムの起動と同時にオーディオセッションを作成します。
Close Device on Idle Focus Loss = アイドル中にフォーカスを失ったらデバイスを閉じる
Automatically close the audio session when loosing window focus and while not playing any sounds. = ウィンドウがフォーカスを失い、音が再生されていないときにオーディオセッションを自動的に閉じます。
Low-Latency Exclusive Mode = 低遅延の排他モード
Reduce audio latency by requesting exlusive device access.\nThis will prevent all *other* applications from playing back or recording audio. = デバイスへの排他アクセスを要求して音声の遅延を減らします。\n有効にすると、*他の*アプリケーションは音声の再生や録音ができなくなります。
Buffer Frame Size = バッファーサイズ（フレーム）
Prevent audio distortion by requesting sufficient buffer size (adding audio latency).\nThe minimum resulting size is the minimum possible size reported by the device. = 十分なバッファーサイズを要求して音割れを防ぎます（遅延は増えます）。\n実際の最小値は、デバイスが報告する最小サイズになります。
