General: Default Creator Name = 常规: 默认作者名称
The name that is automatically filled in when creating a new chart. = 新建谱面时自动填入的作者名称。
General: Drumroll Preview Interval = 常规: 连打预览间隔
The interval at which drumrolls have their hit sounds previewed at. = 预览连打打击音的间隔。
General: Time Display Space = 常规: 时间显示基准
Display time in either Chart Space (normalized starting at 00:00.000) or in Song Space (relative to song offset). = 时间以谱面时间（从 00:00.000 起算）或歌曲时间（相对于歌曲 OFFSET）显示。
Timeline: Invert Scroll Wheel Direction = 时间轴: 反转滚轮方向
Invert the mouse wheel scroll direcion so that scrolling downwards results in moving forward through the timeline. = 反转鼠标滚轮方向，让向下滚动变成在时间轴上向前移动。
Timeline: Scroll Wheel Sensitivity = 时间轴: 滚轮灵敏度
The timeline distance moved per mouse wheel scroll tick. = 鼠标滚轮每滚一格在时间轴上移动的距离。
Timeline: Scroll Wheel Sensitivity (Shift) = 时间轴: 滚轮灵敏度（按住 Shift）
The timeline distance moved per mouse wheel scroll tick while holding down shift. = 按住 Shift 时，鼠标滚轮每滚一格在时间轴上移动的距离。
Animation: Smooth UI Zoom = 动画: 平滑界面缩放
Smoothly animate between UI zoom levels. = 切换界面缩放比例时使用平滑动画。
Animation: Timeline Smooth Scroll Speed = 动画: 时间轴平滑滚动速度
The animation speed when scrolling the timeline. = 滚动时间轴时的动画速度。
Animation: Timeline Smooth Cursor Speed = 动画: 时间轴光标平滑移动速度
The animation speed for the timeline cursor when moving to a new position. = 时间轴光标移动到新位置时的动画速度。
Animation: Timeline Range Selection Speed = 动画: 时间轴范围选取动画速度
The animation speed for the timeline range selection expansion. = 时间轴范围选取展开时的动画速度。
Open Device on Startup = 启动时打开音频设备
Create an audio session as soon as the program starts. = 程序一启动就创建音频会话。
Close Device on Idle Focus Loss = 空闲且失去焦点时关闭音频设备
Automatically close the audio session when loosing window focus and while not playing any sounds. = 窗口失去焦点且没有播放任何声音时，自动关闭音频会话。
Low-Latency Exclusive Mode = 低延迟独占模式
Reduce audio latency by requesting exlusive device access.\nThis will prevent all *other* applications from playing back or recording audio. = 请求独占音频设备以降低延迟。\n启用后，*其他*应用程序都无法播放或录制声音。
Buffer Frame Size = 缓冲区大小（帧）
Prevent audio distortion by requesting sufficient buffer size (adding audio latency).\nThe minimum resulting size is the minimum possible size reported by the device. = 请求足够大的缓冲区以避免声音失真（会增加延迟）。\n实际最小值是设备报告的最小可用大小。
