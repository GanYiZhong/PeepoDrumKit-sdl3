General: Default Creator Name = General: Nombre de autor predeterminado
The name that is automatically filled in when creating a new chart. = El nombre que se rellena automáticamente al crear un chart nuevo.
General: Drumroll Preview Interval = General: Intervalo de previsualización de redobles
The interval at which drumrolls have their hit sounds previewed at. = El intervalo con el que se previsualizan los golpes de los redobles.
General: Time Display Space = General: Referencia de tiempo mostrada
Display time in either Chart Space (normalized starting at 00:00.000) or in Song Space (relative to song offset). = Muestra el tiempo en tiempo del chart (normalizado desde 00:00.000) o en tiempo de la canción (relativo al offset).
Timeline: Invert Scroll Wheel Direction = Línea de tiempo: Invertir dirección de la rueda
Invert the mouse wheel scroll direcion so that scrolling downwards results in moving forward through the timeline. = Invierte la dirección de la rueda del ratón para que desplazar hacia abajo avance por la línea de tiempo.
Timeline: Scroll Wheel Sensitivity = Línea de tiempo: Sensibilidad de la rueda
The timeline distance moved per mouse wheel scroll tick. = La distancia que avanza la línea de tiempo por cada paso de la rueda del ratón.
Timeline: Scroll Wheel Sensitivity (Shift) = Línea de tiempo: Sensibilidad de la rueda (Shift)
The timeline distance moved per mouse wheel scroll tick while holding down shift. = La distancia que avanza la línea de tiempo por cada paso de la rueda con Shift pulsado.
Animation: Smooth UI Zoom = Animación: Zoom suave de la interfaz
Smoothly animate between UI zoom levels. = Anima suavemente los cambios de zoom de la interfaz.
Animation: Timeline Smooth Scroll Speed = Animación: Velocidad de desplazamiento suave
The animation speed when scrolling the timeline. = La velocidad de la animación al desplazar la línea de tiempo.
Animation: Timeline Smooth Cursor Speed = Animación: Velocidad del cursor suave
The animation speed for the timeline cursor when moving to a new position. = La velocidad de la animación del cursor de la línea de tiempo al moverse a una nueva posición.
Animation: Timeline Range Selection Speed = Animación: Velocidad de la selección de rango
The animation speed for the timeline range selection expansion. = La velocidad de la animación al expandir la selección de rango de la línea de tiempo.
Open Device on Startup = Abrir el dispositivo al iniciar
Create an audio session as soon as the program starts. = Crea una sesión de audio en cuanto se inicia el programa.
Close Device on Idle Focus Loss = Cerrar el dispositivo al perder el foco en reposo
Automatically close the audio session when loosing window focus and while not playing any sounds. = Cierra automáticamente la sesión de audio al perder el foco de la ventana si no se está reproduciendo ningún sonido.
Low-Latency Exclusive Mode = Modo exclusivo de baja latencia
Reduce audio latency by requesting exlusive device access.\nThis will prevent all *other* applications from playing back or recording audio. = Reduce la latencia de audio solicitando acceso exclusivo al dispositivo.\nEsto impedirá que *otras* aplicaciones reproduzcan o graben audio.
Buffer Frame Size = Tamaño del búfer (frames)
Prevent audio distortion by requesting sufficient buffer size (adding audio latency).\nThe minimum resulting size is the minimum possible size reported by the device. = Evita la distorsión del audio solicitando un búfer suficientemente grande (añade latencia).\nEl tamaño mínimo resultante es el mínimo posible que indica el dispositivo.
