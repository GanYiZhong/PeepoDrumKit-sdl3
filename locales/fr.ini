General: Default Creator Name = Général: Nom d’auteur par défaut
The name that is automatically filled in when creating a new chart. = Le nom renseigné automatiquement à la création d’un nouveau chart.
General: Drumroll Preview Interval = Général: Intervalle de prévisualisation des roulements
The interval at which drumrolls have their hit sounds previewed at. = L’intervalle auquel les frappes des roulements sont prévisualisées.
General: Time Display Space = Général: Référence d’affichage du temps
Display time in either Chart Space (normalized starting at 00:00.000) or in Song Space (relative to song offset). = Affiche le temps en temps du chart (normalisé à partir de 00:00.000) ou en temps du morceau (relatif à l’offset).
Timeline: Invert Scroll Wheel Direction = Timeline: Inverser le sens de la molette
Invert the mouse wheel scroll direcion so that scrolling downwards results in moving forward through the timeline. = Inverse le sens de la molette pour que le défilement vers le bas avance dans la timeline.
Timeline: Scroll Wheel Sensitivity = Timeline: Sensibilité de la molette
The timeline distance moved per mouse wheel scroll tick. = La distance parcourue dans la timeline à chaque cran de molette.
Timeline: Scroll Wheel Sensitivity (Shift) = Timeline: Sensibilité de la molette (Maj)
The timeline distance moved per mouse wheel scroll tick while holding down shift. = La distance parcourue dans la timeline à chaque cran de molette en maintenant Maj.
Animation: Smooth UI Zoom = Animation: Zoom fluide de l’interface
Smoothly animate between UI zoom levels. = Anime en douceur les changements de zoom de l’interface.
Animation: Timeline Smooth Scroll Speed = Animation: Vitesse du défilement fluide
The animation speed when scrolling the timeline. = La vitesse de l’animation lors du défilement de la timeline.
Animation: Timeline Smooth Cursor Speed = Animation: Vitesse du curseur fluide
The animation speed for the timeline cursor when moving to a new position. = La vitesse de l’animation du curseur de la timeline lorsqu’il se déplace.
Animation: Timeline Range Selection Speed = Animation: Vitesse de la sélection de plage
The animation speed for the timeline range selection expansion. = La vitesse de l’animation d’extension de la sélection de plage dans la timeline.
Open Device on Startup = Ouvrir le périphérique au démarrage
Create an audio session as soon as the program starts. = Crée une session audio dès le démarrage du programme.
Close Device on Idle Focus Loss = Fermer le périphérique à la perte de focus au repos
Automatically close the audio session when loosing window focus and while not playing any sounds. = Ferme automatiquement la session audio lorsque la fenêtre perd le focus et qu’aucun son n’est joué.
Low-Latency Exclusive Mode = Mode exclusif à faible latence
Reduce audio latency by requesting exlusive device access.\nThis will prevent all *other* applications from playing back or recording audio. = Réduit la latence audio en demandant un accès exclusif au périphérique.\nCela empêchera toutes les *autres* applications de lire ou d’enregistrer du son.
Buffer Frame Size = Taille du tampon (frames)
Prevent audio distortion by requesting sufficient buffer size (adding audio latency).\nThe minimum resulting size is the minimum possible size reported by the device. = Évite la distorsion audio en demandant un tampon suffisamment grand (ajoute de la latence).\nLa taille minimale obtenue est la plus petite taille annoncée par le périphérique.
